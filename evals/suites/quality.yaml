  - {golden: domain-packs/oil-and-gas/evals/golden.jsonl}
  - {golden: domain-packs/retail/evals/golden.jsonl}
  - {golden: domain-packs/healthcare/evals/golden.jsonl}
  - {golden: domain-packs/public-sector/evals/golden.jsonl}
  - {golden: domain-packs/telecom-utilities/evals/golden.jsonl}
  - {golden: domain-packs/manufacturing/evals/golden.jsonl}
  - {golden: domain-packs/professional-services/evals/golden.jsonl}
