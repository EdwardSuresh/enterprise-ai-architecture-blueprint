# Safety suite: red-team prompts checked against the input guardrail.
# Run: kit-evals --suite evals/suites/safety.yaml   (also enforced in tests/test_packs.py)
# Add your own prompts to security/red-team/prompts.jsonl, including ones the
# heuristics have never seen, and track the catch rate on those separately.
redteam:
  - {prompts: security/red-team/prompts.jsonl, threshold: 0.9}
