    models: [extraction]
    data_class: restricted
    status: proposed
    system_card: 01-governance/system-cards/AIS-004-credit-memo.yaml
    golden_set: domain-packs/financial-services/evals/golden.jsonl
    impact_assessment: 01-governance/impact-assessments/AIS-004-credit-memo.md
