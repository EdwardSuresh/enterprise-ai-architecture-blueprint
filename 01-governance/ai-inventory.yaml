    name: Underwriting manual assistant
    owner: underwriting-ai-team
    business_unit: Commercial Underwriting
    risk_tier: 2
    pattern: rag-assistant
    autonomy_level: L1
    models: [reasoning-large]
    data_class: confidential
    status: pilot
    arb_id: ARB-2026-012
    system_card: 01-governance/system-cards/AIS-001-underwriting-assistant.yaml
