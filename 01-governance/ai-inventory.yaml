  - id: AIS-003
    name: Fee dispute explainer
    owner: retail-banking-ai
    business_unit: Retail Banking
    risk_tier: 2
    pattern: conversational-customer-agent
    autonomy_level: L2
    models: [reasoning-large, reasoning-small]
    data_class: confidential
    status: production
    arb_id: ARB-2026-019
    system_card: 01-governance/system-cards/AIS-003-fee-dispute.yaml
