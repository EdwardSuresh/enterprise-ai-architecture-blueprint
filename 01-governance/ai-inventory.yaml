    last_review: 2026-10-15

  - id: AIS-002
    name: Meeting notes summarizer
    owner: workplace-tech
    business_unit: IT
    risk_tier: 1
    pattern: content-generation
    autonomy_level: L1
    models: [reasoning-small]
    data_class: internal
    status: production
    system_card: 01-governance/system-cards/AIS-002-meeting-notes.yaml
