[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "architects-enterprise-ai-kit"
version = "1.0.0"
description = "The Architect's Enterprise AI Kit: cloud-neutral, industry-neutral reference implementation for governed enterprise AI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rajaretnam Suresh Edward David" }]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
test = ["pytest>=7.4"]
azure = ["openai>=1.40"]
aws = ["boto3>=1.34"]
gcp = ["google-genai>=1.0"]
anthropic = ["anthropic>=0.40"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
kit-policy-gate = "kit.policy_gate:main"
kit-evals = "kit.evals:main"

[tool.setuptools.packages.find]
where = ["platform/core", "platform/adapters"]

[tool.pytest.ini_options]
testpaths = ["tests"]
