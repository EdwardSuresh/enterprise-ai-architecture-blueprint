# Sector guardrails for the professional services pack.
# Loaded by kit.guardrails. Patterns are Python regex, matched case-insensitively
# against the user input and the draft output. type: block_topic | require_human.
pack: professional-services
rules:
  - id: PS-G01
    description: "Block requests to use another client's information."
    type: block_topic
    patterns: ['\b(other|another|different) clients?''?s? (data|documents|files|information|pricing)\b', '\bfrom (the|a) (screened|walled) matter\b']
    message: "I can't use information from other clients or screened matters."
  - id: PS-G02
    description: "Route final opinions and sign-offs to a qualified professional."
    type: require_human
    patterns: ['\b(sign|issue|finali[sz]e) (the |this |our )?(opinion|audit report|tax return|filing)\b', '\bsend (it|this) to the client\b']
    message: "A qualified professional must review and sign off before this goes to the client."
  - id: PS-G03
    description: "Block fabricated or unverified citations."
    type: block_topic
    patterns: ['\b(make up|invent|fabricate) (a |some )?(case|citation|cite|reference|source)s?\b']
    message: "I can't create citations. Every citation must come from a verified source."
  - id: PS-G04
    description: "Route conflict check decisions to the conflicts team."
    type: require_human
    patterns: ['\b(is there|do we have) a conflict\b', '\bconflict (check|waiver)\b']
    message: "Conflict decisions are made by the conflicts team. Your request has been routed."
