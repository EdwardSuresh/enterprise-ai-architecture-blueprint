# Sector guardrails for the healthcare pack.
# Loaded by kit.guardrails. Patterns are Python regex, matched case-insensitively
# against the user input and the draft output. type: block_topic | require_human.
pack: healthcare
rules:
  - id: HC-G01
    description: "Route possible emergencies to immediate human care."
    type: require_human
    patterns: ['\b(chest pain|can''?t breathe|trouble breathing|stroke|suicid\w*|overdose|severe bleeding)\b']
    message: "If this is an emergency, call 911 or your local emergency number now. A clinician has been alerted."
  - id: HC-G02
    description: "Block diagnosis and prescribing by the assistant."
    type: block_topic
    patterns: ['\bdo i have\b', '\b(diagnose|prescribe)\b', '\bwhat (dose|dosage) should i take\b']
    message: "I can't diagnose or recommend treatment. Please contact your care team."
  - id: HC-G03
    description: "Route medication change requests to a clinician."
    type: require_human
    patterns: ['\b(stop|change|increase|decrease|double) (my )?(medication|meds|dose)\b', '\brefill\b']
    message: "Your request has been sent to your care team for review."
  - id: HC-G04
    description: "Route coverage denials to a qualified reviewer."
    type: require_human
    patterns: ['\b(deny|denial of) (coverage|authorization|the claim)\b']
    message: "Coverage decisions are made by a qualified reviewer. This has been routed."
