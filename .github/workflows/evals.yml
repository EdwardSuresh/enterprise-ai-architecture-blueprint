name: Evals gate
on:
  push: {branches: [main]}
  pull_request:
permissions: {contents: read}
jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e .
      - name: Golden-set quality suite (fails below threshold)
        run: kit-evals --suite evals/suites/quality.yaml
      - name: Red-team safety suite
        run: kit-evals --suite evals/suites/safety.yaml
