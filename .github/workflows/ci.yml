name: CI
on:
  push: {branches: [main]}
  pull_request:
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: {python-version: ["3.10", "3.12"]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python-version }}"}
      - run: pip install -e ".[test]"
      - name: Unit, integration and pack structure tests
        run: pytest -q
      - name: Run all Concept labs
        run: for f in labs/*/concept.py; do echo "::group::$f"; python "$f"; echo "::endgroup::"; done
