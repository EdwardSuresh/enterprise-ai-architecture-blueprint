name: Policy gate
on:
  push: {branches: [main]}
  pull_request:
    paths:
      - "01-governance/**"
      - "02-architecture/standards/**"
      - "config/**"
      - "domain-packs/**"
permissions: {contents: read}
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e .
      - name: Validate AI inventory against risk tiers and approved models
        run: kit-policy-gate
